<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Công trình — Mùa Vàng</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:#294437;font:16px/1.55 "Segoe UI",Tahoma,sans-serif}header{padding:30px 5vw 24px;background:#e4e9d6;border-bottom:1px solid #dedfcd}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:#386647}h1{font-size:32px;line-height:1.2;margin:6px 0}p{color:#67786a;margin:8px 0}a{color:#386647}nav{padding:20px 5vw;display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;border:1px solid #dedfcd;background:#fffdf6;color:inherit;border-radius:24px;padding:8px 17px;cursor:pointer}button.active{color:white;background:#386647;border-color:#386647}button:hover{border-color:#386647}a:focus-visible,button:focus-visible{outline:3px solid #d0a540;outline-offset:3px}main{max-width:1700px;margin:auto;padding:0 5vw 36px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:block;border:1px solid #dedfcd;background:#fffdf6;border-radius:16px;overflow:hidden;color:inherit;text-decoration:none}.card img{display:block;width:100%;aspect-ratio:9/8;object-fit:contain;background:#f2ede0}.caption{padding:14px 17px}.caption strong{display:block}.sub{font-size:13px;color:#67786a}footer{padding:18px 5vw;border-top:1px solid #dedfcd;color:#67786a;font-size:13px}@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){h1{font-size:26px}.grid{grid-template-columns:1fr}button{font-size:14px;padding:7px 12px}}
</style></head><body><header><div class="eyebrow">MÙA VÀNG · ĐẢO NÔNG TRẠI</div><h1>Nhà cửa và chuồng trại</h1><p>16 công trình và đồ dùng. Chạm ảnh để xem ba góc nhìn.</p><a href="../Structures/Farm-preview.png" target="_blank" rel="noopener">Xem nhà và giếng trong nông trại</a> · <a href="Overview.png" target="_blank" rel="noopener">Ảnh tổng hợp</a></header><nav id="nav" aria-label="Nhóm công trình"></nav><main><div class="grid" id="grid"></div></main><footer>Prefab 3D được dựng và render trong Unity, dùng cùng tỷ lệ với nhân vật và cây trồng.</footer><script>
document.title='Chế biến và giao thương — Mùa Vàng';document.querySelector('h1').textContent='Chế biến và giao thương';document.querySelector('header p').textContent='16 mẫu 3D cho canh tác, chế biến và công trình chung. Chạm ảnh để xem ba góc nhìn.';document.querySelector('header a').nextSibling.remove();document.querySelector('header a').remove();
const live=document.createElement('a');live.href='Showcase.png';live.target='_blank';live.rel='noopener';live.textContent='Xem khu trưng bày trong Unity';document.querySelector('header').append(document.createTextNode(' · '),live);
const data=__PRODUCTION_DATA__,groups=['Tất cả',...new Set(data.models.map(m=>m.group))],nav=document.getElementById('nav'),grid=document.getElementById('grid');for(const group of groups){const b=document.createElement('button');b.textContent=group;b.dataset.group=group;nav.append(b)}function show(group){nav.querySelectorAll('button').forEach(b=>{const active=b.dataset.group===group;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});grid.replaceChildren();for(const m of data.models.filter(m=>group==='Tất cả'||m.group===group)){const card=document.createElement('a');card.className='card';card.href=m.name+'-views.png';card.target='_blank';card.rel='noopener';card.innerHTML=`<img src="${m.name}.png" alt="${m.label}" loading="lazy"><div class="caption"><span class="sub">${m.group}${m.animated?' · Có chuyển động':''}</span><strong>${m.label}</strong></div>`;grid.append(card)}}nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.group)});show('Tất cả');
</script></body></html>
