<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toàn bộ model — Mùa Vàng</title><style>
*{box-sizing:border-box}body{margin:0;color:#294437;background:#f5f0e5;font:16px/1.5 "Segoe UI",sans-serif}header{padding:26px 5vw;background:#e4e9d6}h1{margin:6px 0;font-size:32px}p{color:#647465}nav{padding:20px 5vw 12px;display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit;color:inherit;border:1px solid #d4dac8;border-radius:24px;background:#fffdf7;padding:8px 16px}button{cursor:pointer}button.active{background:#386647;color:white}input{width:min(460px,90vw)}.toolbar{padding:8px 5vw 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}main{padding:0 5vw 40px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#fffdf7;border:1px solid #d4dac8;border-radius:16px;overflow:hidden}.card img{width:100%;aspect-ratio:1;display:block;object-fit:contain;background:#f2ede0}.caption{padding:13px 16px}.caption strong{display:block}.caption small{color:#647465}.card a{color:inherit;text-decoration:none}.variants{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}.variants button{font-size:12px;border-radius:8px;padding:5px 8px}.empty{grid-column:1/-1}.status{font-size:14px;color:#647465}footer{padding:20px 5vw;border-top:1px solid #d4dac8;font-size:13px;color:#647465}:focus-visible{outline:3px solid #d0a540;outline-offset:3px}@media(max-width:1200px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><header><p>MÙA VÀNG · ĐẢO NÔNG TRẠI</p><h1>Toàn bộ model 3D</h1><p id="summary"></p></header><nav id="nav" aria-label="Nhóm model"></nav><div class="toolbar"><input id="search" type="search" placeholder="Tìm cây, nhân vật, công trình, đồ dùng…" aria-label="Tìm model"><span id="status" class="status"></span></div><main><div id="grid" class="grid"></div></main><footer>Prefab và ảnh dựng trực tiếp trong Unity. Chạm ảnh để xem ba góc nhìn; các giai đoạn và cấp dùng cùng tỷ lệ trong mỗi loại.</footer><script>
const data=__MODEL_DATA__,groups=['Tất cả',...new Set(data.models.map(x=>x.group))],nav=document.getElementById('nav'),grid=document.getElementById('grid'),search=document.getElementById('search');let current='Tất cả';const selected=new Map();
document.getElementById('summary').textContent=`${data.models.length} loại model · ${data.models.reduce((n,m)=>n+m.variants.length,0)} biến thể trong gallery · ${data.prefabCount} prefab trong project`;
for(const [file,label] of [['model-list.csv','Danh sách model (CSV)'],['coverage.json','Số lượng theo nhóm'],['Unity-library.png','Màn xem model trong Unity']]){const a=document.createElement('a');a.href=file;a.textContent=label;a.style.color='#386647';a.style.marginRight='20px';document.querySelector('footer').append(document.createElement('br'),a)}
for(const group of groups){const b=document.createElement('button');b.textContent=group;b.dataset.group=group;nav.append(b)}
function normal(text){return text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()}
function show(){nav.querySelectorAll('button').forEach(b=>{const active=b.dataset.group===current;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});const q=normal(search.value),models=data.models.filter(m=>(current==='Tất cả'||m.group===current)&&normal(m.label+' '+m.id).includes(q));grid.replaceChildren();document.getElementById('status').textContent=`${models.length} mẫu`;for(const m of models){const card=document.createElement('article');card.className='card';card.dataset.id=m.id;const a=document.createElement('a');a.target='_blank';a.rel='noopener';const image=document.createElement('img');image.loading='lazy';a.append(image);const caption=document.createElement('div');caption.className='caption';const small=document.createElement('small');small.textContent=m.group;const strong=document.createElement('strong');strong.textContent=m.label;const variantLabel=document.createElement('small');caption.append(small,strong,variantLabel);const controls=document.createElement('div');controls.className='variants';function set(i){selected.set(m.id,i);const v=m.variants[i];image.src=v.preview;image.alt=m.label+' · '+v.label;a.href=v.views;variantLabel.textContent=v.label;controls.querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',String(i===j))})}m.variants.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v.label;b.onclick=()=>set(i);controls.append(b)});card.append(a,caption,controls);grid.append(card);set(selected.get(m.id)||0)}if(!models.length){const p=document.createElement('p');p.className='empty';p.textContent='Không tìm thấy model phù hợp.';grid.append(p)}}nav.onclick=e=>{const b=e.target.closest('button');if(b){current=b.dataset.group;show()}};search.oninput=show;show();
</script></body></html>
