<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cấp công trình — Mùa Vàng</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:#294437;font:16px/1.55 "Segoe UI",Tahoma,sans-serif}header{padding:30px 5vw 24px;background:#e4e9d6;border-bottom:1px solid #dedfcd}h1{font-size:32px;margin:6px 0}p{color:#67786a;margin:6px 0}nav{padding:20px 5vw;display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;border:1px solid #dedfcd;background:#fffdf6;border-radius:24px;padding:8px 17px;color:inherit;cursor:pointer}button.active{background:#386647;color:white;border-color:#386647}a{color:#386647}a:focus-visible,button:focus-visible{outline:3px solid #d0a540;outline-offset:3px}main{max-width:1700px;padding:0 5vw 36px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:block;border:1px solid #dedfcd;border-radius:16px;overflow:hidden;background:#fffdf6;color:inherit;text-decoration:none}.card img{width:100%;display:block;aspect-ratio:8/9;object-fit:contain;background:#f2ede0}.caption{padding:13px 17px}.caption strong{display:block}.step{font-size:12px;letter-spacing:1px;color:#386647}.bar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.bar h2{margin:0}footer{padding:18px 5vw;font-size:13px;color:#67786a;border-top:1px solid #dedfcd}@media(max-width:700px){.grid{grid-template-columns:1fr}.bar{align-items:start;flex-wrap:wrap}h1{font-size:26px}}
</style></head><body><header><p>MÙA VÀNG · ĐẢO NÔNG TRẠI</p><h1>3 cấp công trình</h1><p>Cấp 1 đơn giản → cấp 2 hoàn thiện → cấp 3 có phần mở rộng. Ba cấp dùng cùng tỷ lệ để so sánh.</p></header><nav id="nav" aria-label="Chọn công trình"></nav><main id="content"></main><footer>9 công trình · 27 prefab. Có thể đổi cấp trực tiếp trong scene chạy thử Unity.</footer><script>
const data=__LEVEL_DATA__,nav=document.getElementById('nav'),content=document.getElementById('content');for(const b of data.buildings){const button=document.createElement('button');button.textContent=b.label;button.dataset.type=b.type;nav.append(button)}function show(type){const b=data.buildings.find(x=>x.type===type)||data.buildings[0];nav.querySelectorAll('button').forEach(n=>{const active=n.dataset.type===b.type;n.classList.toggle('active',active);n.setAttribute('aria-pressed',String(active))});content.replaceChildren();const bar=document.createElement('div');bar.className='bar';bar.innerHTML=`<h2>${b.label}</h2><a href="${b.type}-levels.png" target="_blank" rel="noopener">Ảnh so sánh 3 cấp</a>`;content.append(bar);const grid=document.createElement('div');grid.className='grid';for(let level=1;level<=3;level++){const card=document.createElement('a');card.className='card';card.href=b.type+'_L'+level+'.png';card.target='_blank';card.rel='noopener';card.innerHTML=`<img src="${card.getAttribute('href')}" alt="${b.label} cấp ${level}"><div class="caption"><div class="step">CẤP ${level}</div><strong>${['Đơn giản','Hoàn thiện','Mở rộng'][level-1]}</strong></div>`;grid.append(card)}content.append(grid)}nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)location.hash=b.dataset.type});addEventListener('hashchange',()=>show(location.hash.slice(1)));show(location.hash.slice(1));
</script></body></html>
