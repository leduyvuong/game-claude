<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thời tiết — Mùa Vàng</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:#294437;font:16px/1.5 "Segoe UI",sans-serif}header,nav,main{padding:22px 5vw}header{background:#e4e9d6}h1{margin:5px 0}p{color:#647465}nav{display:flex;gap:9px;flex-wrap:wrap}button{font:inherit;padding:9px 22px;background:#fffdf7;color:inherit;border:1px solid #d4dac8;border-radius:24px;cursor:pointer}button.active{background:#386647;color:white}img{display:block;width:100%;max-width:1250px;margin:auto;border-radius:16px}main{padding-top:0}a{color:#386647}:focus-visible{outline:3px solid #d0a540;outline-offset:3px}</style></head><body><header><p>MÙA VÀNG · ĐẢO NÔNG TRẠI</p><h1>Thời tiết trong Play Mode</h1><p>Đổi chế độ ở bảng THỜI TIẾT trong Unity. Có nút bật/tắt tiếng và Sét thử khi chọn Bão.</p></header><nav id="nav"></nav><main><h2 id="title"></h2><p id="description"></p><a id="link" target="_blank" rel="noopener"><img id="preview" alt=""></a></main><script>const modes=[['Clear','Nắng','Ánh sáng ấm, trời quang, không có mưa hoặc tuyết.'],['Wind','Gió','Cây dừa lay, lá cuốn theo gió, mặt nước gợn mạnh hơn.'],['Rain','Mưa','Hạt mưa rơi xiên, vòng bắn trên đất và mái, mặt đất ướt và tiếng mưa.'],['Storm','Bão','Mưa dày và gió mạnh, trời tối, chớp, tiếng sấm và gợn nước mạnh.'],['Snow','Tuyết','Hạt tuyết rơi chậm và ánh sáng lạnh.']];const nav=document.getElementById('nav');for(const [id,label]of modes){const b=document.createElement('button');b.textContent=label;b.dataset.id=id;b.onclick=()=>show(id);nav.append(b)}function show(id){const m=modes.find(x=>x[0]===id)||modes[2];document.getElementById('title').textContent=m[1];document.getElementById('description').textContent=m[2];document.getElementById('preview').src=m[0]+'.png';document.getElementById('preview').alt='Nông trại trong chế độ '+m[1];document.getElementById('link').href=m[0]+'.png';nav.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.id===m[0]);b.setAttribute('aria-pressed',String(b.dataset.id===m[0]))})}show('Rain');</script></body></html>
