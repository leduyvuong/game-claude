<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vật nuôi — Mùa Vàng</title>
<style>
:root{--ink:#294437;--green:#386647;--line:#dedfcd;--paper:#f5f0e5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Segoe UI",Tahoma,sans-serif}header{padding:30px 5vw 24px;background:#e4e9d6;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--green)}h1{font-size:32px;line-height:1.2;margin:6px 0}p{color:#67786a;margin:8px 0}nav{padding:20px 5vw;display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;border:1px solid var(--line);background:#fffdf6;color:inherit;border-radius:24px;padding:8px 17px;cursor:pointer}button.active{color:white;background:var(--green);border-color:var(--green)}button:hover{border-color:var(--green)}button:focus-visible,a:focus-visible{outline:3px solid #d0a540;outline-offset:3px}main{max-width:1700px;margin:auto;padding:0 5vw 36px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.poses{grid-template-columns:repeat(4,minmax(0,1fr))}.card{display:block;border:1px solid var(--line);background:#fffdf6;border-radius:16px;overflow:hidden;text-align:left;padding:0;color:inherit;text-decoration:none}.card img{display:block;width:100%;aspect-ratio:8/9;object-fit:contain;background:#f2ede0}.caption{padding:14px 17px}.caption strong{display:block}.sub{font-size:13px;color:#67786a}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.bar h2{margin:0}a{color:var(--green)}footer{padding:18px 5vw;border-top:1px solid var(--line);font-size:13px;color:#67786a}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.poses{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){h1{font-size:26px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.poses{grid-template-columns:1fr}button{font-size:14px;padding:7px 12px}}
</style></head>
<body><header><div class="eyebrow">MÙA VÀNG · ĐẢO NÔNG TRẠI</div><h1>Vật nuôi, chim và cá</h1><p>13 loài trên đảo. Chọn một con để xem các tư thế và ba góc nhìn.</p><a href="Farm-preview.png" target="_blank" rel="noopener">Xem trong nông trại</a></header><nav id="nav" aria-label="Chọn con vật"></nav><main id="content"></main><footer>Ảnh render từ prefab 3D trong Unity. Thú có chuyển động chân, đầu và đuôi; chim vỗ cánh; cá quẫy đuôi và vây.</footer>

    ]
},animals=data.animals,nav=document.getElementById('nav'),content=document.getElementById('content');
const all=document.createElement('button');all.textContent='Tất cả';all.dataset.name='all';nav.append(all);for(const animal of animals){const b=document.createElement('button');b.textContent=animal.label;b.dataset.name=animal.name;nav.append(b)}
function show(name){const animal=animals.find(a=>a.name===name);nav.querySelectorAll('button').forEach(b=>{const active=b.dataset.name===(animal?animal.name:'all');b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});content.replaceChildren();const grid=document.createElement('div');grid.className=animal?'grid poses':'grid';if(animal){const bar=document.createElement('div');bar.className='bar';const title=document.createElement('h2');title.textContent=animal.label;bar.append(title);const links=document.createElement('div');links.innerHTML=`<a href="${animal.name}-views.png" target="_blank" rel="noopener">Ba góc nhìn</a> · <a href="${animal.name}-actions.png" target="_blank" rel="noopener">Ảnh các tư thế</a>`;bar.append(links);content.append(bar);animal.actions.forEach((label,index)=>{const card=document.createElement('a');card.className='card';card.href=animal.name+'-pose-'+index+'.png';card.target='_blank';card.rel='noopener';card.innerHTML=`<img src="${card.getAttribute('href')}" alt="${animal.label}: ${label}"><div class="caption"><strong>${label}</strong></div>`;grid.append(card)})}else{for(const a of animals){const card=document.createElement('button');card.className='card';card.setAttribute('aria-label','Xem '+a.label);card.innerHTML=`<img src="${a.name}.png" alt="${a.label}"><div class="caption"><strong>${a.label}</strong><span class="sub">Xem tư thế và góc nhìn →</span></div>`;card.addEventListener('click',()=>location.hash=a.name);grid.append(card)}}content.append(grid)}
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(b)location.hash=b.dataset.name});addEventListener('hashchange',()=>show(location.hash.slice(1)));show(location.hash.slice(1));
</script></body></html>
